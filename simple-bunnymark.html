<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Bunnymark - Vectorium</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1a1a2e;
      font-family: 'Courier New', monospace;
      color: #eee;
    }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 15px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 8px;
      font-size: 14px;
      z-index: 100;
    }
    #info h2 {
      margin: 0 0 10px 0;
      color: #00ff88;
    }
    #info p {
      margin: 5px 0;
    }
    .key {
      display: inline-block;
      padding: 2px 8px;
      background: #333;
      border-radius: 3px;
      border: 1px solid #555;
      font-weight: bold;
      color: #00ff88;
    }
  </style>
</head>
<body>
  <div id="info">
    <h2>🐰 Simple Bunnymark</h2>
    <p><span class="key">F</span> Spawn 1000 bunnies</p>
    <p><span class="key">SPACE</span> Toggle physics</p>
    <p>New DisplayObject API - PixiJS-style!</p>
  </div>
  
  <script type="module" src="/src/simple-bunnymark.ts"></script>
</body>
</html>
