<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vectorium - Particle Container Bunnymark</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    
    canvas {
      display: block;
      margin: 20px auto;
      border: 2px solid #00ff88;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
    }
    
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border: 1px solid #00ff88;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }
    
    h1 {
      color: #00ff88;
      font-size: 18px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div id="info">
    <h1>🚀 Vectorium Particle Container Bunnymark</h1>
    <p>Ultra-High Performance Mode (1M+ bunnies)</p>
    <p>Press E → Click "Bunnymark (Progressive)" to start</p>
  </div>
  
  <script type="module" src="/src/bunnytest.ts"></script>
</body>
</html>
